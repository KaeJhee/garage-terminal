name: Weekly Price Update

# ============================================================
# SCHEDULE: Runs every Sunday at midnight UTC
# Trigger manually from the Actions tab via "Run workflow"
# ============================================================
on:
  schedule:
    - cron: '0 0 * * 0'   # Sunday 00:00 UTC
  workflow_dispatch:        # Manual trigger - useful for testing

permissions:
  contents: write   # Needed to commit and push data.js + config + price_history

# One data update at a time; a second run waits instead of racing the first one's push
concurrency:
  group: garage-data
  cancel-in-progress: false

jobs:
  update-prices:
    name: Scrape Prices & Regenerate History
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # The built-in GITHUB_TOKEN pushes the bot commit; Vercel deploys every push to main
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      # Nothing is scraped or committed unless the tests and config checks pass
      - name: Run checks
        run: |
          python tests/test_sales.py
          node tests/test_config_roundtrip.js
          node tests/validate_config.js

      # Scrape sold-only median prices from Bring a Trailer (reads cars.config.js automatically).
      # Fails, and writes nothing, if no page shows a single sold result.
      - name: Scrape latest prices
        run: python scraper/scrape_prices.py
        env:
          SCRAPE_DELAY_SEC: '3'

      # Keep the raw scrape for 90 days, even when a later step fails
      - name: Upload scraped_prices.json
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scraped_prices
          path: scraper/scraped_prices.json

      # Append real sales to price_history.json, patch config, rebuild data.js
      - name: Regenerate price history
        run: python scraper/generate_history.py

      # The patched config and the rebuilt data.js must both still load before they are committed
      - name: Check generated files
        run: |
          node tests/validate_config.js
          node tests/test_config_roundtrip.js
          node -e "new Function(require('fs').readFileSync('frontend/data.js','utf8')+';return BAKED_HISTORY')()" && echo "data.js OK"

      # Commit. IMPORTANT: price_history.json is the persistent sales store and
      # MUST be committed, or every weekly run starts from an empty history.
      # scraped_prices.json is gitignored (regenerated each run), so it is not staged.
      - name: Commit updated files
        run: |
          git config user.name  "garage-terminal-bot"
          git config user.email "bot@ghoststrategies.io"
          git add frontend/data.js frontend/cars.config.js frontend/price_history.json
          git diff --staged --quiet || git commit -m "chore: weekly price update $(date -u +'%Y-%m-%d')"

      # Take any commit pushed while this ran; a real conflict fails the job loudly
      - name: Push changes
        run: git pull --rebase && git push

      - name: Print summary
        run: |
          echo "### Price Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "Updated: $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          if [ -f scraper/scraped_prices.json ]; then
            python3 -c "import json;d=json.load(open('scraper/scraped_prices.json'));print(f\"- Total: {d.get('total_cars','?')}  Scraped: {d.get('scraped','?')}  Thin: {d.get('thin','?')}  Fallback: {d.get('fallback','?')}\")" >> $GITHUB_STEP_SUMMARY
          fi
